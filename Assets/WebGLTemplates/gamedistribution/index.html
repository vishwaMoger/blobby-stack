<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e0d46;
                 user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1e0d46; outline: none; touch-action: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: radial-gradient(ellipse at 50% 30%, #3a1b6b 0%, #1e0d46 55%, #070418 100%);
              font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; transition: opacity .35s; }
    #loader h1 { margin: 0 0 28px; font-size: clamp(32px, 8vw, 64px); letter-spacing: .04em; text-shadow: 0 6px 0 rgba(0,0,0,.25); }
    #bar { width: min(60vw, 360px); height: 18px; border-radius: 9px; background: rgba(255,255,255,.15); overflow: hidden; }
    #fill { width: 0%; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #d77cff, #ff7ae6); transition: width .15s; }
  </style>
  <script>
    // GameDistribution SDK, loaded once while the game loads. Events are queued until the game's
    // GameDistribution.jslib bridge registers window.sjGdSend, then forwarded to Unity.
    window.sjGdQueue = [];
    window.sjGdEvent = function (name) {
      if (window.sjGdSend) window.sjGdSend(name);
      else window.sjGdQueue.push(name);
    };
    window["GD_OPTIONS"] = {
      "gameId": "__GD_GAME_ID__",
      "onEvent": function (event) { window.sjGdEvent(event.name); }
    };
    (function (d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s);
      js.id = id;
      js.src = "https://html5.api.gamedistribution.com/main.min.js";
      // Blocked or offline: start the game without ads instead of waiting for SDK_READY.
      js.onerror = function () { window.sjGdEvent("SJ_SDK_FAILED"); };
      fjs.parentNode.insertBefore(js, fjs);
    }(document, "script", "gamedistribution-jssdk"));
  </script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><h1>{{{ PRODUCT_NAME }}}</h1><div id="bar"><div id="fill"></div></div></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loader = document.querySelector("#loader");
    var fill = document.querySelector("#fill");
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Cap the render resolution so high-DPI phones stay smooth.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        loader.style.opacity = "0";
        setTimeout(function () { loader.remove(); }, 400);
        canvas.focus();
      }).catch(function (message) {
        showError("Couldn't start the game. Please reload the page.");
        console.error(message);
      });
    };
    script.onerror = function () {
      showError("Couldn't load the game. Check your connection and reload.");
    };
    function showError(text) {
      fill.parentNode.style.display = "none";
      var p = document.createElement("p");
      p.textContent = text;
      p.style.cssText = "margin:0;font-size:18px;opacity:.9;text-align:center;padding:0 24px";
      loader.appendChild(p);
      loader.style.opacity = "1";
    }
    document.body.appendChild(script);
  </script>
</body>
</html>
